name: Publish PyPI
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Version tag to publish (for example v0.1.0a1)"
        required: true
        default: "v0.1.0a1"
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify version tag
        env:
          RELEASE_REF: ${{ inputs.ref || github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_REF"] != "v" + version:
              raise SystemExit("Release ref must match the version tag in pyproject.toml")
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check installed distribution
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          python tools/smoke_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gxpy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
