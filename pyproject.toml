[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "gxpy"
version = "0.1.0a1"
description = "Umbrella installation package for the GX Simulator Python ecosystem"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "SUNCAST contributors"}]
keywords = ["solar physics", "GX Simulator", "active regions", "coronal modeling", "metapackage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pyAMPP>=1.0.2,<2",
  "pyGXRender>=0.0.3.0,<0.1",
  "pyEUVTools>=0.2.1,<0.3",
  "pyCHMP>=0.2.0,<0.3",
]

[project.urls]
Homepage = "https://github.com/suncast-org/gxpy"
Documentation = "https://github.com/suncast-org/gxpy#readme"
Repository = "https://github.com/suncast-org/gxpy"
Issues = "https://github.com/suncast-org/gxpy/issues"
Changelog = "https://github.com/suncast-org/gxpy/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = []
